name: reusable-opentofu-check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  iac_check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TM_DISABLE_SAFEGUARDS: git-out-of-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
      - run: |
          uv python install 3.13
          uv sync --locked --dev
      - run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/tofu.tar.gz https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_amd64.tar.gz
          echo "378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69  /tmp/tofu.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/tofu.tar.gz -C /tmp tofu
          sudo install -m 0755 /tmp/tofu /usr/local/bin/tofu
      - run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/terramate.tar.gz https://github.com/terramate-io/terramate/releases/download/v0.17.3/terramate_0.17.3_linux_x86_64.tar.gz
          echo "303fd597a76af00c728b3eb626493dc2a71585dcd679c5e07a338da44d24a060  /tmp/terramate.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/terramate.tar.gz -C /tmp terramate
          sudo install -m 0755 /tmp/terramate /usr/local/bin/terramate
      - run: |
          tofu version | grep -Fx 'OpenTofu v1.13.1'
          terramate version | grep -F '0.17.3'
          make iac-check
