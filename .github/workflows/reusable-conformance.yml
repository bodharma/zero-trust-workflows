name: reusable-conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.0"
          python-version: "3.13"
          enable-cache: true
      - run: uv python install 3.13
      - run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind" | sha256sum --check --strict
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e
        with:
          version: v1.35.9
          checksum: 3cfeaf80be482b435b0aa214aff6e0b2c312ee23c0ff20810c75517b6004c6eb
      - run: |
          uv --version
          uv --version | grep -Eq '^uv 0\.13\.0([[:space:]]|$)'
          uv run --no-project --python 3.13 python --version
          uv run --no-project --python 3.13 python -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          kind version
          kind version | grep -Eq '^kind v0\.33\.0([[:space:]]|$)'
          kubectl version --client
          kubectl version --client | grep -Fx 'Client Version: v1.35.9'
      - run: uv sync --locked --dev
      - run: make trusted-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ztbp-evidence
          path: .artifacts/trusted/evidence
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
