name: trusted-evidence

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    uses: bodharma/zero-trust-workflows/.github/workflows/reusable-conformance.yml@f451d058ca9e052997a79e4fc041b051b1f7c942
  attest:
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: bodharma/zero-trust-workflows/.github/workflows/reusable-evidence-attestation.yml@f451d058ca9e052997a79e4fc041b051b1f7c942
    permissions:
      contents: read
      id-token: write
  verify:
    needs: attest
    uses: bodharma/zero-trust-workflows/.github/workflows/reusable-evidence-verification.yml@f451d058ca9e052997a79e4fc041b051b1f7c942
