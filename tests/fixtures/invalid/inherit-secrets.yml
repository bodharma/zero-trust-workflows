name: Inherit secrets
on: push
permissions:
  contents: read
jobs:
  attest:
    uses: bodharma/zero-trust-workflows/.github/workflows/reusable-evidence-attestation.yml@3d3c42e5aac5ba805825da76410c181273ba90b1
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    secrets: inherit
